# 曲のメタデータのテンプレートです。scores/<slug>/metadata.yaml にコピーして編集してください。
# 各フィールドの説明は docs/metadata.md を参照してください。使わないフィールドは削除するかコメントのままにできます。docs/metadata.md に載っていないフィールド（midi や quantize などの内部のサブフィールドを含む）はエラーになります。

# ---- クレジット（タイトル部と MusicXML のクレジットにだけ反映されます。日本語で書けます）
slug: my-song-slug                 # ディレクトリ名と同じにします（記録用のみ）
title: 曲名
# subtitle: 副題
artist: アーティスト名
# album: アルバム名                # 『アルバム名』の形で印字されます
composer: 作曲者
lyricist: 作詞者
# vocal: 歌手                      # 値が同じ役割は 1 つにまとまります（例：「作詞・作曲：…」）
transcriber: 採譜者
arranger: 採譜者                   # transcriber と同じ場合は「ドラム採譜・編曲：…」と印字されます
note: 本譜には採譜者による再構成・創作を含みます。   # 「備考：…」と印字されます
# copyright: "© …"                 # 1 ページ目の下部に印字されます
# credits:                         # 役割ラベルを書き換えます
#   vocal: ボーカル
# legend: true                     # 1 ページ目に楽器の凡例を印字します（既定は印字なし。true / false を引用符なしで。--legend でも指定できます）

# ---- MIDI とドラムマップ
drum_map: gm                       # gm（GM の 10 チャンネルなど）| fpc-default（FL Studio FPC）| マップ YAML のパス
# note_map:                        # ノートを個別に書き換えます。MIDI ノート番号: 楽器 ID（configs/instruments.yaml を参照）
#   35: kick
#   40: hand-clap
# midi:                            # 複数トラックの MIDI でドラムトラックを自動判定できないときだけ必要です
#   tracks: [Drums]                # トラック名に含まれる文字列（大文字小文字は区別しません）、またはトラック番号（0 始まり）
#   channels: [10]                 # MIDI チャンネル 1–16

# ---- テンポ・拍子・弱起
# tempo_bpm: 120                   # 既定では譜面の開始位置で有効な MIDI のテンポを使います
# time_signature: "4/4"            # MIDI に拍子記号イベントがないときだけ使います。ある場合は MIDI と一致している必要があります
# pickup_beats: 0                  # 弱起小節の拍数（整数、4 分音符単位）
# source_leading_beats: 0          # 元の MIDI で 1 小節目が始まる拍の位置。既定は pickup_beats と同じです

# ---- クオンタイズ
quantize:
  subdivision: 4                   # 4 = 16 分音符グリッド、2 = 8 分音符グリッド
  tuplets: auto                    # auto = 拍ごとに 3 連符を自動判定、off = 3 連符を使わない（引用符の有無は問いません）
  # flam_window: 1/8               # 装飾音の判定幅（4 分音符単位）。0 で無効

# ---- 強弱（既定では無効。手のパートにだけ作用します）
# dynamics:
#   ghost_below: 40                # ベロシティがこの値未満 → 括弧付きの符頭（ゴーストノート）
#   accent_above: 110              # ベロシティがこの値超 → アクセント >

# ---- 記譜（反復記号・連桁・段間）
# notation:
#   repeats: simile                # simile = % と //（既定）、full = さらに |: ... :| と 1./2. 括弧を追加、off = 使わない（--repeats が優先）
#   repeat_counters: true          # 既定は false（印字なし）。true にすると 1 小節の % が 2 小節以上連続するときに回数（2, 3, 4…）を印字（true / false を引用符なしで）
#   beam_eighths: beat             # beat = 拍ごとに連桁（既定）、half-bar = 4/4 の半小節 4 連 8 分音符をまとめる（--beam-eighths が優先）
#   system_spacing: 1.1            # PDF の段間倍率（0.7–2.5、既定 1.1、1.0 で標準の詰めた間隔。PDF のみ、--system-spacing が優先）

# ---- セクション（リハーサルマーク・複縦線。トップレベルに記述します）
# sections:
#   1: Intro                       # 元の小節番号（折りたたみ前・1 以上の整数）: 印字可能な ASCII 文字列（1〜24 文字）
#   9: A
#   25: Chorus
