# 曲目元数据模板。复制为 scores/<slug>/metadata.yaml 后修改。
# 字段说明见 docs/metadata.md。不用的字段可以删掉或保持注释；docs/metadata.md 未列出的字段（含 midi、quantize 等内部的子字段）会报错。

# ---- 署名（只影响标题区与 MusicXML 署名；可以写日文）
slug: my-song-slug                 # 与目录名相同，仅作记录
title: 曲名
# subtitle: 副标题
artist: アーティスト名
# album: アルバム名                # 印成『アルバム名』
composer: 作曲者
lyricist: 作詞者
# vocal: 歌手                      # 值相同的职务会合并，例如「作詞・作曲：…」
transcriber: 採譜者
arranger: 採譜者                   # 与 transcriber 相同时印成「ドラム採譜・編曲：…」
note: 本譜には採譜者による再構成・創作を含みます。   # 印成「備考：…」
# copyright: "© …"                 # 印在第一页底部
# credits:                         # 改写职务标签
#   vocal: ボーカル
# legend: true                     # 第一页是否印凡例（true / false，不加引号）

# ---- MIDI 与鼓映射
drum_map: gm                       # gm（GM 第 10 通道等）| fpc-default（FL Studio FPC）| 映射 YAML 路径
# note_map:                        # 逐个改写音符：MIDI 音符号: 乐器 ID（见 configs/instruments.yaml）
#   35: kick
#   40: hand-clap
# midi:                            # 多轨 MIDI 无法自动判断鼓轨时才需要
#   tracks: [Drums]                # 轨道名包含的文字（不区分大小写），或轨道序号（从 0 开始）
#   channels: [10]                 # MIDI 通道 1–16

# ---- 速度、拍号、弱起
# tempo_bpm: 120                   # 默认取乐谱起点生效的 MIDI 速度
# time_signature: "4/4"            # MIDI 没有拍号事件时才用；有时必须与 MIDI 一致
# pickup_beats: 0                  # 弱起小节的拍数（整数，四分音符）
# source_leading_beats: 0          # 源 MIDI 中第 1 小节开始的拍数；默认等于 pickup_beats

# ---- 量化
quantize:
  subdivision: 4                   # 4 = 16 分网格；2 = 8 分网格
  tuplets: auto                    # auto = 逐拍自动识别三连音；off = 不记三连音（加不加引号都行）
  # flam_window: 1/8               # 装饰音窗口（四分音符为单位），0 关闭

# ---- 力度（默认不启用；只作用于手部）
# dynamics:
#   ghost_below: 40                # 力度小于此值 → 括号符头
#   accent_above: 110              # 力度大于此值 → 重音 >
