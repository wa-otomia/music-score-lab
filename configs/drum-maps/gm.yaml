name: General MIDI / GS 打击乐
description: >
  GM Level 1 打击乐键位 35–81，加上 GS/GM2 扩展 27–34 与 82–87。
  音符名称依据 General MIDI 规范；谱面位置与符头见 configs/instruments.yaml。
notes:
  27: high-q
  28: slap
  29: scratch-push
  30: scratch-pull
  31: sticks
  32: square-click
  33: metronome-click
  34: metronome-bell
  35: kick-2           # Acoustic Bass Drum；只用这一个底鼓时可在 note_map 中改成 kick
  36: kick             # Bass Drum 1
  37: side-stick
  38: snare            # Acoustic Snare
  39: hand-clap
  40: snare            # Electric Snare（印成同一个军鼓；两者同时用时转换器会提示重叠）
