jingle-bell:     {name: Jingle Bell,       name_ja: ジングルベル,         abbr: JB,  part: hand, staff: n, head: diamond}
bell-tree:       {name: Bell Tree,         name_ja: ベルツリー,           abbr: BT,  part: hand, staff: o, head: rhombus}
castanets:       {name: Castanets,         name_ja: カスタネット,         abbr: CS,  part: hand, staff: m, head: rhombus}
